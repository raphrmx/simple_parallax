name: simple_parallax_example
description: "Demonstrates how to use the simple_parallax plugin."
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  sensors_plus: ^7.1.0
  simple_parallax:
    path: ../
  video_player: ^2.14.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
