name: simple_parallax
description: >-
  Parallax widgets for Flutter, with a container mode and a per-item mode.
  Pure Dart, no dependencies, works with any ImageProvider.
version: 1.0.1
homepage: https://www.comapps.be
repository: https://github.com/raphrmx/simple_parallax
issue_tracker: https://github.com/raphrmx/simple_parallax/issues

topics:
  - parallax
  - animation
  - scrolling
  - ui
  - widgets

environment:
  sdk: ^3.4.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
